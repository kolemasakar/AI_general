name: Build Ukrainian awards catalog
on:
  push:
    paths:
      - 'awards-ukraine/catalog_names.txt'
      - 'awards-ukraine/build_catalog.py'
      - '.github/workflows/build-awards-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: python -m pip install python-docx
      - name: Generate catalog
        run: python awards-ukraine/build_catalog.py
      - name: Publish document to public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awards-ukraine/*.docx
          if ! git diff --cached --quiet; then
            git commit -m "Generate awards catalog DOCX draft"
            git push
          fi
