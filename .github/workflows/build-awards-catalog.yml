name: Build Ukrainian awards catalog
on:
  push:
    paths:
      - 'awards-ukraine/catalog_names.txt'
      - 'awards-ukraine/build_catalog.py'
      - '.github/workflows/build-awards-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install python-docx requests beautifulsoup4 pillow
      - name: Fetch official reference images and audit pixel dimensions
        run: python awards-ukraine/fetch_reference_images.py
      - name: Search Wikimedia Commons for remaining awards
        run: python awards-ukraine/fetch_commons_images.py
      - name: Generate catalog
        run: python awards-ukraine/build_catalog.py
      - name: Publish document to public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awards-ukraine/build_count.txt awards-ukraine/image_coverage.txt awards-ukraine/*.docx awards-ukraine/image_sources.csv awards-ukraine/image_sources_commons.csv awards-ukraine/images_reference/ awards-ukraine/images/
          if ! git diff --cached --quiet; then
            git commit -m "Generate awards catalog DOCX draft"
            git push
          fi
